<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>warm journal · cherish</title>
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300..600&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #faf6f0;
      background-image: radial-gradient(circle at 10% 20%, rgba(245, 235, 220, 0.7) 0%, transparent 30%),
                        radial-gradient(circle at 90% 70%, rgba(230, 215, 190, 0.5) 0%, transparent 40%);
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem;
      color: #3d352e;
    }

    /* main journal card – warm, paper-like */
    .journal-app {
      width: 100%;
      max-width: 1300px;
      height: 90vh;
      background: #fffcf8;
      border-radius: 2.5rem;
      box-shadow: 0 20px 40px -12px rgba(100, 70, 40, 0.25), 0 2px 10px 0 rgba(0, 0, 0, 0.03), inset 0 1px 4px #fff9f0;
      display: flex;
      overflow: hidden;
      border: 1px solid #f0e5d8;
      backdrop-filter: blur(2px);
    }

    /* --- SIDEBAR (warm, cozy) --- */
    .sidebar {
      width: 280px;
      background: #f9f1e7;
      border-right: 1px solid #eadbc9;
      display: flex;
      flex-direction: column;
      padding: 2rem 1rem 1.5rem 1rem;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 2.5rem;
      padding-left: 0.75rem;
    }

    .logo i {
      font-size: 1.8rem;
      color: #b48b6c;
    }

    .logo h1 {
      font-family: 'Newsreader', serif;
      font-weight: 400;
      font-size: 1.9rem;
      letter-spacing: -0.5px;
      color: #5e4b3a;
      line-height: 1;
    }

    .logo span {
      font-size: 0.9rem;
      color: #aa8b74;
      margin-left: 2px;
    }

    .nav-section {
      margin-bottom: 2rem;
    }

    .nav-section h3 {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #b19782;
      margin-bottom: 0.8rem;
      padding-left: 0.75rem;
      font-weight: 500;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0.8rem 0.75rem;
      border-radius: 1.5rem;
      color: #5b4a3b;
      font-weight: 400;
      transition: all 0.15s ease;
      cursor: pointer;
      font-size: 0.95rem;
    }

    .nav-item i {
      width: 1.4rem;
      font-size: 1.1rem;
      color: #b48b6c;
    }

    .nav-item.active {
      background: #ffffffd9;
      box-shadow: 0 4px 12px rgba(180, 140, 100, 0.08);
      font-weight: 500;
      color: #3f2f22;
    }

    .nav-item:not(.active):hover {
      background: #f3e8dd;
    }

    .tag-cloud {
      margin-top: 0.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      padding-left: 0.75rem;
    }

    .tag {
      background: #ebe0d4;
      padding: 0.3rem 0.9rem;
      border-radius: 2rem;
      font-size: 0.75rem;
      color: #5e4b3a;
      font-weight: 400;
      cursor: pointer;
      transition: all 0.1s;
    }

    .tag:hover, .tag.active {
      background: #b48b6c;
      color: #fff;
    }

    .sidebar-footer {
      margin-top: auto;
      padding: 1rem 0.75rem 0.5rem;
      border-top: 1px solid #e7d9cb;
      font-size: 0.8rem;
      color: #a58e7a;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .sidebar-footer i {
      color: #c7a68b;
    }

    /* --- MAIN CONTENT --- */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .top-bar {
      padding: 1.8rem 2rem 0.8rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .date-badge {
      font-family: 'Newsreader', serif;
      font-size: 1.2rem;
      font-weight: 400;
      color: #8b725d;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      white-space: nowrap;
    }

    .date-badge i {
      color: #c7a68b;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: #f3ece4;
      border: 1px solid #eadbc9;
      border-radius: 2rem;
      padding: 0.3rem 0.8rem;
      max-width: 260px;
      width: 100%;
    }

    .search-box input {
      border: none;
      background: transparent;
      outline: none;
      font-size: 0.85rem;
      color: #5e4b3a;
      padding: 0.2rem 0.4rem;
      width: 100%;
    }

    .search-box i {
      color: #b48b6c;
      font-size: 0.85rem;
    }

    .actions {
      display: flex;
      gap: 0.5rem;
    }

    .icon-btn {
      background: #f3ece4;
      border: none;
      width: 2.4rem;
      height: 2.4rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #8b725d;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.15s;
      border: 1px solid #eadbc9;
    }

    .icon-btn:hover {
      background: #e9ded2;
      color: #5e4b3a;
    }

    /* editor card */
    .editor-area {
      padding: 0 2rem 1.5rem 2rem;
    }

    .editor-card {
      background: #ffffff;
      border-radius: 2rem;
      box-shadow: 0 6px 18px rgba(150, 120, 90, 0.06);
      border: 1px solid #f1e6db;
      padding: 1.6rem 1.8rem;
      transition: box-shadow 0.2s;
    }

    .editor-card:focus-within {
      box-shadow: 0 10px 24px rgba(160, 120, 80, 0.1);
    }

    .editor-title input {
      width: 100%;
      border: none;
      font-family: 'Newsreader', serif;
      font-size: 1.6rem;
      font-weight: 400;
      color: #3d352e;
      outline: none;
      background: transparent;
      padding: 0.2rem 0;
      margin-bottom: 0.5rem;
      letter-spacing: -0.3px;
    }

    .editor-title input::placeholder {
      color: #cdbcac;
      font-style: italic;
      font-weight: 300;
    }

    .editor-text textarea {
      width: 100%;
      border: none;
      resize: none;
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      line-height: 1.6;
      color: #4e4137;
      outline: none;
      background: transparent;
      padding: 0.5rem 0;
      min-height: 80px;
      max-height: 160px;
    }

    .editor-text textarea::placeholder {
      color: #cbbaa9;
      font-style: italic;
      font-weight: 300;
    }

    /* Dynamic Tag Builder Area */
    .editor-tags-builder {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.4rem;
    }

    .editor-tags-builder input {
      border: none;
      background: #f9f1e7;
      border-radius: 1rem;
      padding: 0.2rem 0.8rem;
      font-size: 0.75rem;
      outline: none;
      color: #5e4b3a;
      width: 130px;
    }

    .tag-chip {
      background: #ebe0d4;
      padding: 0.2rem 0.6rem;
      border-radius: 1rem;
      font-size: 0.75rem;
      color: #5e4b3a;
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .tag-chip i {
      cursor: pointer;
      font-size: 0.65rem;
      color: #a28d7a;
    }

    .tag-chip i:hover {
      color: #c46b4a;
    }

    .editor-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 0.8rem;
      padding-top: 0.8rem;
      border-top: 1px solid #f0e7de;
    }

    .mood-selector {
      display: flex;
      gap: 0.6rem;
    }

    .mood {
      font-size: 1.2rem;
      cursor: pointer;
      opacity: 0.4;
      transition: all 0.15s ease;
      user-select: none;
    }

    .mood.active {
      opacity: 1;
      transform: scale(1.25);
    }

    .editor-buttons {
      display: flex;
      gap: 0.8rem;
      align-items: center;
    }

    .btn {
      border: none;
      padding: 0.6rem 1.4rem;
      border-radius: 2rem;
      font-weight: 500;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      transition: 0.15s;
      font-family: 'Inter', sans-serif;
    }

    .btn-primary {
      background: #b48b6c;
      color: white;
      box-shadow: 0 4px 10px rgba(180, 140, 100, 0.25);
    }

    .btn-primary:hover {
      background: #a0795b;
    }

    .btn-secondary {
      background: #f3ece4;
      color: #6b5a4b;
    }

    .btn-secondary:hover {
      background: #e9ded2;
    }

    /* entries list */
    .entries-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.2rem 2rem 2rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      scrollbar-width: thin;
      scrollbar-color: #d9cbbd #f9f1e7;
    }

    .entries-list::-webkit-scrollbar {
      width: 6px;
    }

    .entries-list::-webkit-scrollbar-thumb {
      background: #d9cbbd;
      border-radius: 10px;
    }

    .entry-item {
      background: #fefcf9;
      border-radius: 1.8rem;
      padding: 1.4rem 1.6rem;
      border: 1px solid #f0e3d6;
      transition: all 0.15s;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.01);
      position: relative;
      cursor: pointer;
    }

    .entry-item:hover {
      background: #ffffff;
      border-color: #e6d6c6;
      box-shadow: 0 8px 18px -6px rgba(150, 120, 90, 0.12);
    }

    .entry-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .entry-title-wrap {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .entry-header h4 {
      font-family: 'Newsreader', serif;
      font-weight: 500;
      font-size: 1.2rem;
      color: #3d352e;
      letter-spacing: -0.2px;
    }

    .entry-meta {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      font-size: 0.75rem;
      color: #a28d7a;
    }

    .entry-meta i {
      font-size: 0.7rem;
      color: #c7a68b;
    }

    .entry-actions {
      display: flex;
      gap: 0.4rem;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .entry-item:hover .entry-actions {
      opacity: 1;
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: #c46b4a;
      cursor: pointer;
      font-size: 0.8rem;
      padding: 0.2rem;
    }

    .entry-preview {
      font-size: 0.9rem;
      color: #6b5a4b;
      line-height: 1.5;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      white-space: pre-wrap;
    }

    .entry-tags {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.2rem;
      flex-wrap: wrap;
    }

    .entry-tag {
      background: #f2e9e1;
      padding: 0.15rem 0.8rem;
      border-radius: 2rem;
      font-size: 0.7rem;
      color: #7d6857;
    }

    .empty-msg {
      text-align: center;
      color: #b8a392;
      font-style: italic;
      padding: 2rem;
      font-size: 0.95rem;
    }

    /* Modal Overlay for Entry Detail */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(60, 45, 30, 0.3);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: #fffcf8;
      border-radius: 2rem;
      padding: 2rem;
      width: 90%;
      max-width: 600px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      border: 1px solid #f0e5d8;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #f0e7de;
      padding-bottom: 0.8rem;
    }

    .modal-body {
      font-size: 1rem;
      line-height: 1.7;
      color: #4e4137;
      white-space: pre-wrap;
    }

    /* Responsiveness */
    @media (max-width: 800px) {
      .sidebar {
        width: 80px;
        padding: 1.5rem 0.5rem;
      }
      .logo h1, .logo span, .nav-section h3, .nav-item span, .tag-cloud, .sidebar-footer span {
        display: none;
      }
      .logo {
        justify-content: center;
        padding-left: 0;
      }
      .nav-item {
        justify-content: center;
        padding: 0.8rem 0;
      }
      .nav-item i {
        font-size: 1.4rem;
      }
      .sidebar-footer {
        justify-content: center;
      }
      .main {
        padding: 0.5rem;
      }
      .top-bar {
        padding: 1rem;
        flex-wrap: wrap;
      }
      .search-box {
        max-width: 100%;
        order: 3;
      }
    }
  </style>
</head>
<body>
  <div class="journal-app">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="logo">
        <i class="fas fa-feather-alt"></i>
        <h1>warm<span>journal</span></h1>
      </div>

      <div class="nav-section">
        <h3>navigation</h3>
        <div class="nav-item active" data-filter="all">
          <i class="fas fa-pen-fancy"></i>
          <span>All Entries</span>
        </div>
        <div class="nav-item" data-filter="favorites">
          <i class="fas fa-heart"></i>
          <span>Favorites</span>
        </div>
      </div>

      <div class="nav-section">
        <h3>tags</h3>
        <div class="tag-cloud" id="sidebarTagCloud">
          <!-- Dynamic tags will be populated here -->
        </div>
      </div>

      <div class="sidebar-footer">
        <i class="fas fa-cloud-moon"></i>
        <span>cherish every thought</span>
      </div>
    </aside>

    <!-- Main journal area -->
    <main class="main">
      <!-- Top bar -->
      <div class="top-bar">
        <div class="date-badge">
          <i class="fas fa-calendar-day"></i>
          <span id="currentDate">monday, april 7</span>
        </div>

        <div class="search-box">
          <i class="fas fa-search"></i>
          <input type="text" id="searchInput" placeholder="Search thoughts or tags...">
        </div>

        <div class="actions">
          <button class="icon-btn" id="exportBtn" title="Export Entries (JSON)"><i class="fas fa-download"></i></button>
          <button class="icon-btn" id="clearStorageBtn" title="Reset All Data"><i class="fas fa-trash-alt"></i></button>
        </div>
      </div>

      <!-- Editor card -->
      <div class="editor-area">
        <div class="editor-card">
          <div class="editor-title">
            <input type="text" id="entryTitle" placeholder="Give this moment a name...">
          </div>
          <div class="editor-text">
            <textarea id="entryContent" placeholder="Write freely, warm and slow..."></textarea>
          </div>
          
          <!-- Custom Tags Input -->
          <div class="editor-tags-builder" id="tagsBuilder">
            <input type="text" id="tagInput" placeholder="+ Add tag (Press Enter)">
          </div>

          <div class="editor-toolbar">
            <div class="mood-selector" id="moodSelector">
              <span class="mood active" data-mood="🌿" title="grateful">🌿</span>
              <span class="mood" data-mood="☁️" title="peaceful">☁️</span>
              <span class="mood" data-mood="✨" title="inspired">✨</span>
              <span class="mood" data-mood="🌸" title="tender">🌸</span>
            </div>
            <div class="editor-buttons">
              <button class="btn btn-secondary" id="clearBtn"><i class="fas fa-undo-alt"></i> clear</button>
              <button class="btn btn-primary" id="saveBtn"><i class="fas fa-feather"></i> save entry</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Entries list -->
      <div class="entries-list" id="entriesList"></div>
    </main>
  </div>

  <!-- Detail Modal -->
  <div class="modal-overlay" id="detailModal">
    <div class="modal-card">
      <div class="modal-header">
        <div class="entry-title-wrap">
          <span id="modalMood" style="font-size: 1.4rem;"></span>
          <h3 id="modalTitle" style="font-family: 'Newsreader', serif; font-size: 1.5rem;"></h3>
        </div>
        <button class="icon-btn" id="closeModalBtn"><i class="fas fa-times"></i></button>
      </div>
      <div class="entry-meta" id="modalMeta"></div>
      <div class="modal-body" id="modalContent"></div>
      <div class="entry-tags" id="modalTags"></div>
    </div>
  </div>

  <script>
    (function() {
      // Default state seed
      const DEFAULT_ENTRIES = [
        {
          id: '1',
          title: 'evening wind',
          content: 'the air smelled like rain and old books. i felt held by something bigger.',
          time: '8:22 pm',
          date: new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }),
          mood: '☁️',
          tags: ['#peaceful', '#nature'],
          favorite: true
        },
        {
          id: '2',
          title: 'small win',
          content: 'finished the project i was avoiding. celebrated with a warm cup of tea.',
          time: '2:15 pm',
          date: new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }),
          mood: '✨',
          tags: ['#growth', '#gratitude'],
          favorite: false
        }
      ];

      // Application State
      let entries = JSON.parse(localStorage.getItem('warm_journal_entries')) || DEFAULT_ENTRIES;
      let activeMood = '🌿';
      let currentDraftTags = [];
      let activeFilter = 'all'; // 'all', 'favorites', or tag name (e.g., '#gratitude')
      let searchQuery = '';

      // DOM Elements
      const dateEl = document.getElementById('currentDate');
      const titleInput = document.getElementById('entryTitle');
      const contentInput = document.getElementById('entryContent');
      const saveBtn = document.getElementById('saveBtn');
      const clearBtn = document.getElementById('clearBtn');
      const entriesList = document.getElementById('entriesList');
      const moodSelector = document.getElementById('moodSelector');
      const tagInput = document.getElementById('tagInput');
      const tagsBuilder = document.getElementById('tagsBuilder');
      const sidebarTagCloud = document.getElementById('sidebarTagCloud');
      const searchInput = document.getElementById('searchInput');
      const exportBtn = document.getElementById('exportBtn');
      const clearStorageBtn = document.getElementById('clearStorageBtn');

      // Modal Elements
      const detailModal = document.getElementById('detailModal');
      const modalTitle = document.getElementById('modalTitle');
      const modalMood = document.getElementById('modalMood');
      const modalMeta = document.getElementById('modalMeta');
      const modalContent = document.getElementById('modalContent');
      const modalTags = document.getElementById('modalTags');
      const closeModalBtn = document.getElementById('closeModalBtn');

      // Init Date
      const today = new Date();
      dateEl.textContent = today.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }).toLowerCase();

      // Helpers
      function saveState() {
        localStorage.setItem('warm_journal_entries', JSON.stringify(entries));
        render();
      }

      function getCurrentTime() {
        const now = new Date();
        let hours = now.getHours();
        const minutes = now.getMinutes().toString().padStart(2, '0');
        const ampm = hours >= 12 ? 'pm' : 'am';
        hours = hours % 12 || 12;
        return `${hours}:${minutes} ${ampm}`;
      }

      // Render Draft Tags Chips
      function renderDraftTags() {
        const existingChips = tagsBuilder.querySelectorAll('.tag-chip');
        existingChips.forEach(c => c.remove());

        currentDraftTags.forEach((tag, idx) => {
          const chip = document.createElement('span');
          chip.className = 'tag-chip';
          chip.innerHTML = `${tag} <i class="fas fa-times" data-idx="${idx}"></i>`;
          tagsBuilder.insertBefore(chip, tagInput);
        });
      }

      // Render Sidebar Tags
      function renderSidebarTags() {
        sidebarTagCloud.innerHTML = '';
        const allTags = new Set();
        entries.forEach(e => e.tags.forEach(t => allTags.add(t)));

        if (allTags.size === 0) {
          sidebarTagCloud.innerHTML = '<span style="font-size:0.75rem; color:#a58e7a;">No tags yet</span>';
          return;
        }

        allTags.forEach(tag => {
          const tagEl = document.createElement('span');
          tagEl.className = `tag ${activeFilter === tag ? 'active' : ''}`;
          tagEl.textContent = tag;
          tagEl.addEventListener('click', () => {
            activeFilter = activeFilter === tag ? 'all' : tag;
            render();
          });
          sidebarTagCloud.appendChild(tagEl);
        });
      }

      // Render Entry Cards
      function renderEntries() {
        entriesList.innerHTML = '';

        let filtered = entries.filter(e => {
          const matchesSearch = e.title.toLowerCase().includes(searchQuery.toLowerCase()) || 
                                e.content.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                e.tags.some(t => t.toLowerCase().includes(searchQuery.toLowerCase()));
          
          if (!matchesSearch) return false;

          if (activeFilter === 'favorites') return e.favorite;
          if (activeFilter.startsWith('#')) return e.tags.includes(activeFilter);
          return true;
        });

        if (filtered.length === 0) {
          entriesList.innerHTML = `<div class="empty-msg">No cherished moments found...</div>`;
          return;
        }

        filtered.forEach(entry => {
          const item = document.createElement('div');
          item.className = 'entry-item';

          item.innerHTML = `
            <div class="entry-header">
              <div class="entry-title-wrap">
                <span>${entry.mood || '🌿'}</span>
                <h4>${escapeHtml(entry.title) || 'untitled moment'}</h4>
              </div>
              <div class="entry-meta">
                <i class="far fa-clock"></i> ${entry.time}
                <i class="fas fa-heart toggle-fav" style="color:${entry.favorite ? '#c46b4a' : '#d9b8a2'}; cursor:pointer;"></i>
                <div class="entry-actions">
                  <button class="delete-btn" title="Delete"><i class="fas fa-trash"></i></button>
                </div>
              </div>
            </div>
            <div class="entry-preview">${escapeHtml(entry.content)}</div>
            <div class="entry-tags">
              ${entry.tags.map(t => `<span class="entry-tag">${escapeHtml(t)}</span>`).join('')}
            </div>
          `;

          // Event Listeners for Entry Card
          item.addEventListener('click', (e) => {
            if (e.target.closest('.delete-btn') || e.target.closest('.toggle-fav')) return;
            openModal(entry);
          });

          item.querySelector('.toggle-fav').addEventListener('click', (e) => {
            e.stopPropagation();
            entry.favorite = !entry.favorite;
            saveState();
          });

          item.querySelector('.delete-btn').addEventListener('click', (e) => {
            e.stopPropagation();
            entries = entries.filter(e => e.id !== entry.id);
            saveState();
          });

          entriesList.appendChild(item);
        });
      }

      function render() {
        renderDraftTags();
        renderSidebarTags();
        renderEntries();
      }

      function escapeHtml(text) {
        if (!text) return '';
        return text.replace(/[&<>"']/g, m => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
        }[m]));
      }

      // Modal Functions
      function openModal(entry) {
        modalMood.textContent = entry.mood || '🌿';
        modalTitle.textContent = entry.title || 'Untitled Moment';
        modalMeta.innerHTML = `<i class="far fa-calendar"></i> ${entry.date || ''} &nbsp; <i class="far fa-clock"></i> ${entry.time}`;
        modalContent.textContent = entry.content;
        modalTags.innerHTML = entry.tags.map(t => `<span class="entry-tag">${escapeHtml(t)}</span>`).join('');
        detailModal.classList.add('open');
      }

      closeModalBtn.addEventListener('click', () => detailModal.classList.remove('open'));
      detailModal.addEventListener('click', (e) => {
        if (e.target === detailModal) detailModal.classList.remove('open');
      });

      // User Input Handlers
      moodSelector.addEventListener('click', (e) => {
        const moodSpan = e.target.closest('.mood');
        if (!moodSpan) return;
        document.querySelectorAll('.mood').forEach(m => m.classList.remove('active'));
        moodSpan.classList.add('active');
        activeMood = moodSpan.dataset.mood;
      });

      tagInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          let val = tagInput.value.trim();
          if (val) {
            if (!val.startsWith('#')) val = '#' + val;
            if (!currentDraftTags.includes(val)) {
              currentDraftTags.push(val);
              tagInput.value = '';
              renderDraftTags();
            }
          }
        }
      });

      tagsBuilder.addEventListener('click', (e) => {
        if (e.target.classList.contains('fa-times')) {
          const idx = e.target.dataset.idx;
          currentDraftTags.splice(idx, 1);
          renderDraftTags();
        }
      });

      saveBtn.addEventListener('click', () => {
        const title = titleInput.value.trim();
        const content = contentInput.value.trim();

        if (!title && !content) return;

        const newEntry = {
          id: Date.now().toString(),
          title: title || 'Untitled Moment',
          content: content,
          time: getCurrentTime(),
          date: today.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }),
          mood: activeMood,
          tags: currentDraftTags.length ? [...currentDraftTags] : ['#reflection'],
          favorite: false
        };

        entries.unshift(newEntry);
        
        // Reset Editor
        titleInput.value = '';
        contentInput.value = '';
        currentDraftTags = [];
        saveState();

        saveBtn.innerHTML = '<i class="fas fa-check"></i> saved';
        setTimeout(() => {
          saveBtn.innerHTML = '<i class="fas fa-feather"></i> save entry';
        }, 1000);
      });

      clearBtn.addEventListener('click', () => {
        titleInput.value = '';
        contentInput.value = '';
        currentDraftTags = [];
        renderDraftTags();
      });

      // Filter & Search Controls
      document.querySelectorAll('.sidebar .nav-item').forEach(item => {
        item.addEventListener('click', function() {
          document.querySelectorAll('.sidebar .nav-item').forEach(i => i.classList.remove('active'));
          this.classList.add('active');
          activeFilter = this.dataset.filter;
          render();
        });
      });

      searchInput.addEventListener('input', (e) => {
        searchQuery = e.target.value;
        renderEntries();
      });

      // Data Persistence Utility Controls
      exportBtn.addEventListener('click', () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(entries, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", "warm_journal_entries.json");
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
      });

      clearStorageBtn.addEventListener('click', () => {
        if (confirm("Are you sure you want to clear all journal entries?")) {
          localStorage.removeItem('warm_journal_entries');
          entries = [];
          render();
        }
      });

      // Initial Render
      render();
    })();
  </script>
</body>
</html>
